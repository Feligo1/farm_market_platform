name: FarmConnect smoke tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/farmconnect-smoke.yml'
      - 'index.html'
      - 'docs/index.html'
      - 'admin.html'
      - 'docs/admin.html'
      - 'prices.html'
      - 'docs/prices.html'
      - 'dashboard.html'
      - 'docs/dashboard.html'
      - 'docs/settings.html'
      - 'supabase/functions/**'
      - 'farmconnect-theme.css'
      - 'farmconnect-nav.js'
      - 'docs/farmconnect-theme.css'
      - 'docs/farmconnect-nav.js'
      - 'find-buyers.html'
      - 'news.html'
      - 'settings.html'
      - 'login.html'
      - 'register.html'
      - 'profile.html'
      - 'docs/login.html'
      - 'docs/register.html'
      - 'docs/profile.html'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check live GitHub Pages and Supabase API
        env:
          SITE: https://feligo1.github.io/farm_market_platform
          API: https://qlfsmwvehigoildkuevq.supabase.co/functions/v1/farmconnect-api
          ADMIN: https://qlfsmwvehigoildkuevq.supabase.co/functions/v1/farmconnect-admin
        run: |
          python3 - <<'PY'
          import os, json, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          def get(url):
              for attempt in range(4):
                  try:
                      with urlopen(Request(url,headers={"User-Agent":"FarmConnectSmoke/1.0"}),timeout=20) as r:
                          return r.status,r.read(400000).decode("utf-8")
                  except HTTPError as e:
                      return e.code,e.read(10000).decode("utf-8")
                  except Exception:
                      if attempt==3: raise
                      time.sleep(5)
          site=os.environ["SITE"]; api=os.environ["API"]; admin=os.environ["ADMIN"]
          for name,path,expected in [("homepage","/", "FarmConnect"),("admin page","/admin.html","Admin Control Center"),("history page","/prices.html","History"),("login","/login.html","Email address or username"),("registration","/register.html","No account required"),("profile","/profile.html","Farming details"),("news page","/news.html","FarmConnect"),("buyers page","/find-buyers.html","FarmConnect"),("settings","/settings.html","Settings"),("theme","/farmconnect-theme.css","fc-global-nav"),("navigation","/farmconnect-nav.js","fc-nav-links")]:
              code,html=get(site+path)
              assert code==200 and expected.lower() in html.lower(),f"{name} failed HTTP {code}"
              print(f"PASS: {name}")

          code,homepage=get(site+"/")
          assert code==200 and 'id="market-overview"' in homepage,"Merged market overview missing"
          assert 'id="fcMarketList"' in homepage and 'id="livePricesContainer"' in homepage,"Live prices / market dashboard missing"
          assert all(text not in homepage for text in ["Why Choose FarmConnect?","Multiple Ways to Access","Ready to Get Started?","Create Free Account",">Register</a>",">Login</a>"]),"Legacy account/promotional text remains"
          code,old_dashboard=get(site+"/dashboard.html")
          assert code==200 and "index.html#market-overview" in old_dashboard,"Old dashboard should redirect to homepage"
          print("PASS: consolidated homepage and retired dashboard")
          nav=get(site+"/farmconnect-nav.js")[1]
          assert '["dashboard.html"' not in nav,"Dashboard link remains in global navigation"
          for path in ["/","/prices.html","/find-buyers.html","/news.html","/admin.html","/profile.html","/login.html","/register.html"]:
              _,document=get(site+path)
              assert 'href="dashboard.html"' not in document, f"Dashboard link remains on {path}"
          print("PASS: no links to retired Dashboard")
          assert 'admin.href = "admin.html"' not in nav,"Admin must not appear in shared navigation for any visitor"
          assert 'admin.textContent' not in nav,"Admin item is still being created by shared navigation"
          assert 'id="adminNavItem"' not in homepage,"Hidden old admin menu remains in homepage markup"
          assert 'farmconnect-nav.js?v=20261122-5' in homepage,"Homepage is loading stale navigation script"
          print("PASS: no Admin link in public navigation, including cached legacy versions")



          assert "await fetchUserStats()" not in homepage,"Legacy homepage initialization bug still present"
          assert 'const displayPrices = uniquePrices.slice(0, 6)' in homepage,"Homepage preview must be compact"
          assert 'View all market prices & history' in homepage,"Missing link to detailed market prices"
          code,settings_page=get(site+"/settings.html")
          assert code==200 and "Settings moved" in settings_page,"Duplicate settings page was not consolidated"
          css=get(site+"/farmconnect-theme.css")[1]
          assert "body > .top-nav" in css and "--text-primary:#172b25" in css,"Single navbar or readable text rules missing"
          assert "background:#2E8B57!important" in css,"Green site branding must remain unchanged"
          print("PASS: readable font, green navbar, consolidated settings and price preview")

          for name,path,field in [("status","/status","status"),("commodities","/commodities","commodities"),("markets","/markets","markets"),("history","/prices/history?commodity=Maize&days=540","history")]:
              code,body=get(api+path)
              assert code==200,f"{name} returned HTTP {code}: {body[:300]}"
              data=json.loads(body)
              assert data.get("success") is True,f"{name} API failure: {data}"
              assert field in data,f"{name} missing field {field}"
              if name=="commodities":assert len(data["commodities"])>=10
              if name=="markets":assert len(data["markets"])>=8
              if name=="history":
                  assert len(data["history"])>=1,"No historical records"
                  assert all(x.get("data_kind")!="demo" or not x.get("is_verified") for x in data["history"]),"Synthetic records incorrectly verified"
              print(f"PASS: {name}")
          code,body=get(admin+"?resource=users")
          assert code==401,f"Admin endpoint should reject anonymous requests; got {code}"
          nav_code=get(site+"/farmconnect-nav.js")[1]
          css_code=get(site+"/farmconnect-theme.css")[1]
          assert "fc-nav-inner" in nav_code and "fc-nav-toggle" not in nav_code,"Navbar script still includes hamburger"
          assert "border-bottom:3px solid #3cc5bd" in css_code,"Shared dark navbar theme not deployed"
          print("PASS: reference-style horizontal navbar without hamburger")
          print("PASS: unauthorized admin access denied")
          code,body=get(api+"/profile")
          assert code==401,f"Profile must reject anonymous access, got {code}: {body[:100]}"
          print("PASS: profile access protected")
          code,login=get(site+"/login.html")
          assert "Administrator sign in" in login,"Admin-only login page was not published"
          print("PASS: administrator login remains available")
          def post(path,payload):
              request=Request(api+path,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","User-Agent":"FarmConnectSmoke/1.0"},method="POST")
              try:
                  with urlopen(request,timeout=25) as resp:return resp.status,json.loads(resp.read().decode())
              except HTTPError as e:return e.code,json.loads(e.read().decode())
          code,data=post("/register",{"email":"invalid","password":"short"})
          assert code==410,f"Public registration should be disabled HTTP {code}: {data}"
          print("PASS: public registration disabled")
          code,data=post("/login",{"username":"not-a-real-user-for-smoketest","password":"invalid-password"})
          assert code==401,f"Bad login must return 401, got {code}: {data}"
          print("PASS: incorrect credentials rejected")
          PY

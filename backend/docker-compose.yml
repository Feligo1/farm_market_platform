# docker-compose.yml
version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql://root:password@db/farm_market
      - REDIS_URL=redis://redis:6379
      - AFRICASTALKING_API_KEY=${AFRICASTALKING_API_KEY}
      - AFRICASTALKING_USERNAME=${AFRICASTALKING_USERNAME}
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=farm_market
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  scheduler:
    build: .
    command: python scheduler.py
    environment:
      - DATABASE_URL=mysql://root:password@db/farm_market
      - AFRICASTALKING_API_KEY=${AFRICASTALKING_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  mysql_data: